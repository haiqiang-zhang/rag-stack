<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title description">
  <title id="title">RAG-Stack evaluator architecture</title>
  <desc id="description">RAG-Stack passes a resolved candidate and active questions through its registry to one selected evaluator. Backend providers register with BackendSpec and Python entry points. RAG-Stack-Evaluator supplies static_gt. Custom evaluators provide their own execution and scoring through the same contract. Backends use host-owned global tracing hooks and return one EvaluationResult. RAG-Stack validates the result, sends quality scores to the optimizer, and sends RAG-IR to the cost model. Hooks capture call and node identities, producer references, tokens, bytes, and structured item/list counts from real calls. Sequential hybrid runs dense retrieval, BM25, then RRF. Workflow structure is independent of analytical model coverage. Workflow can be derived from the candidate and observed stages; dynamic mode requires a complete trace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#365d83"/>
    </marker>
    <marker id="registration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#886739"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #19334d; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .body { font-size: 17px; fill: #40566d; }
      .small { font-size: 15px; fill: #40566d; }
      .code { font-family: "DejaVu Sans Mono", Consolas, monospace; }
      .host { fill: #eef5fc; stroke: #b8cee5; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #8baac9; stroke-width: 1.5; }
      .provider { fill: #ffffff; stroke: #d4b481; stroke-width: 1.5; }
      .flow { fill: none; stroke: #365d83; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="1080" fill="#ffffff"/>
  <text x="500" y="45" text-anchor="middle" font-size="30" font-weight="700">One evaluator interface, interchangeable backends</text>
  <text x="500" y="77" text-anchor="middle" class="body">RAG-Stack owns the contract, registration, tracing hooks, and validation.</text>

  <!-- Host API: configuration, selection, and the common call boundary. -->
  <rect x="32" y="100" width="936" height="242" rx="16" class="host"/>
  <text x="58" y="133" class="heading">RAG-Stack · public extension API</text>
  <text x="942" y="133" text-anchor="end" class="body">Hooks: IDs, tokens, bytes, counts</text>
  <rect x="270" y="155" width="460" height="64" rx="10" class="node"/>
  <text x="500" y="181" text-anchor="middle" class="label" style="font-size: 19px">Resolved candidate + active questions</text>
  <text x="500" y="205" text-anchor="middle" class="body">Configuration and evaluation workload</text>
  <path d="M 500 219 V 247" class="flow"/>
  <rect x="270" y="247" width="460" height="68" rx="10" class="node"/>
  <text x="500" y="275" text-anchor="middle" class="label">Registry selects one Evaluator</text>
  <text x="500" y="301" text-anchor="middle" class="body code">evaluate(config, ...)</text>

  <!-- Dashed registration is separate from the solid execution flow. -->
  <path d="M 880 410 V 281 H 734" fill="none" stroke="#886739" stroke-width="2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#registration-arrow)"/>
  <rect x="777" y="349" width="162" height="49" rx="6" fill="#ffffff"/>
  <text x="858" y="368" text-anchor="middle" class="body">BackendSpec</text>
  <text x="858" y="390" text-anchor="middle" class="body">+ entry points</text>
  <path d="M 500 315 V 410" class="flow"/>
  <text x="518" y="378" class="body">Call selected backend</text>

  <!-- Provider choices are alternatives, not parallel execution stages. -->
  <rect x="32" y="410" width="936" height="240" rx="16" fill="#fff8ed" stroke="#dfc392" stroke-width="1.5"/>
  <text x="58" y="444" class="heading">Backend providers · interchangeable implementations</text>
  <rect x="70" y="470" width="400" height="113" rx="10" class="provider"/>
  <text x="270" y="499" text-anchor="middle" class="body" font-weight="700">RAG-Stack-Evaluator/</text>
  <text x="270" y="535" text-anchor="middle" class="label code">static_gt</text>
  <text x="270" y="562" text-anchor="middle" class="small">Sequential dense → BM25 → RRF</text>
  <rect x="530" y="470" width="400" height="113" rx="10" class="provider"/>
  <text x="730" y="499" text-anchor="middle" class="body" font-weight="700">Your package</text>
  <text x="730" y="535" text-anchor="middle" class="label">Custom evaluator</text>
  <text x="730" y="562" text-anchor="middle" class="small">Custom execution and scoring</text>
  <text x="500" y="616" text-anchor="middle" class="body code">capture_trace → trace_query / trace_batch → trace_stage</text>

  <!-- Every provider returns the same result to the same host validation. -->
  <rect x="32" y="718" width="936" height="320" rx="16" class="host"/>
  <text x="58" y="751" class="heading">RAG-Stack</text>
  <path d="M 500 650 V 750" class="flow"/>
  <text x="518" y="692" class="body">Return</text>
  <rect x="270" y="750" width="460" height="72" rx="10" class="node"/>
  <text x="500" y="780" text-anchor="middle" class="label code">EvaluationResult</text>
  <text x="500" y="806" text-anchor="middle" class="body">Quality scores + trace + optional workflow</text>
  <path d="M 500 822 V 858" class="flow"/>
  <rect x="270" y="858" width="460" height="58" rx="10" class="node"/>
  <text x="500" y="894" text-anchor="middle" class="label" style="font-size: 19px">Validate scores, trace, and question IDs</text>
  <path d="M 500 916 V 937 H 260 V 954" class="flow"/>
  <path d="M 500 937 H 740 V 954" class="flow"/>
  <text x="328" y="932" text-anchor="middle" class="small">Scores</text>
  <text x="672" y="932" text-anchor="middle" class="small">RAG-IR</text>
  <rect x="70" y="954" width="380" height="60" rx="10" class="node"/>
  <text x="260" y="981" text-anchor="middle" class="label">Optimizer</text>
  <text x="260" y="1003" text-anchor="middle" class="body">Quality objectives</text>
  <rect x="550" y="954" width="380" height="60" rx="10" class="node"/>
  <text x="740" y="981" text-anchor="middle" class="label">RAG-CM</text>
  <text x="740" y="1003" text-anchor="middle" class="body">Performance prediction</text>
  <text x="500" y="1064" text-anchor="middle" class="small">Workflow describes nodes and inputs; trace records calls; CM checks model coverage.</text>
</svg>
