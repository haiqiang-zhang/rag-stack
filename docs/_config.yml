title: RAG-Stack Documentation
description: User guides and technical documentation for RAG-Stack.
url: "https://haiqiang-zhang.github.io"
baseurl: "/rag-stack"
repository: haiqiang-zhang/rag-stack

# Legacy branch-publishing fallback. MkDocs excludes this file from its build.
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

color_scheme: light
nav_enabled: true
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: true
  focus_shortcut_key: "k"

enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  "RAG-Stack on GitHub":
    - "https://github.com/haiqiang-zhang/rag-stack"
aux_links_new_tab: true

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: purple
