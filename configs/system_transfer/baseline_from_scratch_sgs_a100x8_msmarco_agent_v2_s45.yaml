# sgs_a100x8_msmarco_agent_v2_s45.yaml — 6-section schema.
# Normal-mode A100x8 twin of paper_bench_msmarco_agent_v2_s45.yaml.
# Optimizer: agent_qnehvi (LLM-agent-assisted qNEHVI — the agent MOBO method).
# Agent v2 keeps the historical MSMARCO Agent search space and optimizer
# parameters, but uses an isolated project namespace and the measured run's
# DeepSeek quality-judge identity. Generator and query-expansion calls still
# use the shared four-Qwen gateway. See README_msmarco_agent_v2.md.
global:
  eval_backend: static_gt
  rag_ir_mode: dynamic          # explicit (= default) — trace+workflow-schema replay via the DYNAMIC engine (sequential & react alike); `static` = aggregate token-stats via the static engine
  n_iterations: 50
  gen_fingerprint_dedup: true   # M3: identical generation inputs inherit the donor quality (GT_FP, no budget seat)
dataset:
  # MS MARCO full-scale protocol: the COMPLETE 8.84M-passage corpus (Tevatron
  # msmarco-passage-corpus) searched end-to-end, quality scored on a 100-query
  # seed-fixed sample of the v2.1 dev answerable set (qa_test — same budget as
  # dragonball qa_en_sample_100). qa carries `references` = the annotator-
  # selected GOLD passages (is_selected==1), which provide real retrieval
  # ground truth for the DeepEval context precision/recall diagnostics.
  dataset_name: msmarco_full
  qa: datasets/msmarco_full/qa_test.parquet
  corpus: datasets/msmarco_full/corpus.parquet
system:
  # Stable identity for the exact A100x8 + dual-EPYC 7742 physical system.
  # Strict CM calibration: every required component/stage profile must have
  # exact valid coefficients, grids, and held-out diagnostics; missing or
  # malformed profiles fail closed.
  system_hardware: sgs_a100x8_epyc7742
  rag_cm:
    calibration_mode: strict
  performance_source: cost_model
  system_space_owner: cost_model
  gpu: A100_80GB_GPU
  cpu:
    hardware_key: epyc_7742_2s
    num_cores: 128
    # 128 cores x 3.4 GHz max boost x 32 FP32 FLOP/cycle (2x AVX2 FMA).
    peak_flops: 1.39264e13
    peak_int_ops: 6.9632e12
    # 128-core parallel-first-touch and one-core local-NUMA STREAM medians.
    mem_bandwidth: 227400300000
    mem_bandwidth_1t: 21993800000
    memory_tiers:
      # Aggregate caps are five-run medians from exactly pinned, first-touch,
      # one-worker-per-physical-core triads. One-thread values are raw STREAM.
      - {name: L2, bandwidth: 6887002665021, bandwidth_1t: 103079200000, capacity: 524288}
      # One 16 MiB L3 instance is shared by four physical cores (32 instances).
      - {name: L3, bandwidth: 3159966930492, bandwidth_1t: 63586200000, capacity: 16777216}
      - {name: ddr, bandwidth: 227400300000, bandwidth_1t: 21993800000, capacity: 1081962737664}
    topology: {type: numa, sockets: 2, cores_per_socket: 64}
  available_gpus: ["cuda:0", "cuda:1", "cuda:2", "cuda:3", "cuda:4", "cuda:5", "cuda:6", "cuda:7"]
  interconnect:
    # The audited CUDA runtime path is non-uniform by CPU socket. Keep the two
    # four-GPU socket islands explicit; all unlisted pairs use cross-socket data.
    gpu_gpu:
      type: cuda_peer_runtime_hmm_same_socket
      bandwidth_gbps: 0.680893523
      latency_us: 49215.7641601565
      fallback:
        type: cuda_peer_runtime_hmm_cross_socket
        bandwidth_gbps: 0.6808828765
        latency_us: 49215.6201171875
      links:
        - devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
          type: cuda_peer_runtime_hmm_same_socket
          bandwidth_gbps: 0.680893523
          latency_us: 49215.7641601565
        - devices: ["cuda:4", "cuda:5", "cuda:6", "cuda:7"]
          type: cuda_peer_runtime_hmm_same_socket
          bandwidth_gbps: 0.680893523
          latency_us: 49215.7641601565
    # Conservative direction-wide local-NUMA CUDA DMA: minimum one-way
    # bandwidth and maximum measured one-way latency across all eight GPUs.
    gpu_cpu:
      type: pcie4_host_local_numa_cuda_dma
      bandwidth_gbps: 24.622335179
      latency_us: 2.482559979

  performance_objectives:
    selection: max_throughput
  retrieval:
    # Derive query-time threads as min(request batch, physical cores), matching
    # the source MSMARCO runs; IVF mode 0 is the calibrated runtime contract.
    faiss_num_threads: null
    faiss_ivf_parallel_mode: 0
  cm_search_space:
    # Re-sweep the complete one-host A100 deployment space. These bounds and
    # runtime axes match the target branch's A100x8 calibration sweep contract.
    placement_policy: [collocated, disaggregated]
    min_num_gpus: 1
    max_num_gpus: 8
    max_num_gpus_per_stage: 8
    gpus_per_server: 8
    max_batch_size_request: 256
    batch_size_decode: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    dynamic_batch_timeout_s: [0.002, 0.01, 0.05]
    no_microbatching: true
    allow_decode_collocation: true
optimizer:
  type: agent_qnehvi
  params:
    seed: 45
    n_both_init: 10
    agent_model: deepseek-v4-flash
    agent_strict: true
    n_candidates: 256
eval_backend_setting:
  # Quality scalar = combined_quality = JUST deepeval_answer_correctness.
  # Faithfulness and context precision/recall are diagnostic sub-metrics. They
  # run on the fixed query subset below while answer correctness runs on all QA.
  combined_quality:
    mode: mean
    metrics:
    - deepeval_answer_correctness
  metrics:
  - metric_name: deepeval_answer_correctness
    model: openai/deepseek/deepseek-v4-flash
    description: GEval factual correctness of the generated answer vs the gold answer — THE optimized quality target, score in [0,1]. End-to-end — anything that changes the retrieved evidence OR the generation can move it, so read the sub-metrics below as a breakdown of where correctness is won or lost.
  - metric_name: deepeval_faithfulness
    model: openai/deepseek/deepseek-v4-flash
    description: Is the answer grounded in the retrieved context — no claims that contradict or aren't supported by it (a hallucination check)? Mainly a generation-side signal (model, temperature, prompt), but a noisy or off-topic context makes grounding harder, so weak retrieval can pull it down too.
  - metric_name: deepeval_context_precision
    model: openai/deepseek/deepseek-v4-flash
    description: Of the chunks fed to the generator, how many are genuinely relevant and are the relevant ones ranked first? A retrieval-quality signal — chunking, index fidelity, top_k, reranking all move it — though query expansion upstream changes what gets retrieved. In direct tension with recall — grabbing more chunks usually lowers precision.
  - metric_name: deepeval_context_recall
    model: openai/deepseek/deepseek-v4-flash
    description: Does the retrieved context actually contain the information needed to answer (coverage of the gold facts)? Retrieval-side — chunk size, index, top_k, reranker. Loosening retrieval (bigger top_k / chunks) raises recall but tends to cost precision and can bury the answer among distractors.
  submetric_query_subset: 15
algo_search_space:
  vectordb:
  # Index FAMILY is a search dimension: the semantic_retrieval module's dict-form
  # `vectordb` selector sweeps the family names and is compiled into REAL Ax
  # gating — the non-chosen family's block params here (and its nested query-time
  # knob) are INACTIVE per trial, and the resolver drops the unreferenced block
  # entirely. No phantom dims: GP/RF inputs stay clean and no eval budget lands
  # on inert knobs.
  - name: faiss_ivf_index
    db_type: faiss_ivf
    embedding_model: huggingface_all_mpnet_base_v2   # FIXED to one embedder (768-dim, DERIVED) — index-build over 8.84M vectors is too slow to sweep 3
    embedding_dtype_bytes: 4  # serialized FAISS query vector is float32
    collection_name: my_index
    # embedding_dim is DERIVED from embedding_model (EMBEDDING_MODEL_DIMS) — do not set.
    nlist_factor:
    - 1
    - 4
    index_type:                            # search dim: IVF-PQ vs IVF-Flat
      pq:
        dsub:                              # search dim: target sub-vector dim (=D/M). M is DERIVED
        - 4
        - 32
        nbits:
        - 4
        - 8
      flat: {}
  - name: faiss_hnsw_index
    db_type: faiss_hnsw
    embedding_model: huggingface_all_mpnet_base_v2   # FIXED to one embedder (768-dim, DERIVED) — index-build over 8.84M vectors is too slow to sweep 3
    embedding_dtype_bytes: 4  # serialized FAISS query vector is float32
    collection_name: my_hnsw_index
    # embedding_dim is DERIVED from embedding_model (EMBEDDING_MODEL_DIMS) — do not set.
    M:                            # HNSW build-time: graph degree (search dim; D-independent)
    - 16
    - 48
    ef_construction:              # HNSW build-time: build-time candidate breadth (search dim)
    - 100
    - 400
  corpus:
    # msmarco_full: chunker PINNED (scalars = fixed values, NOT search dims) —
    # the ONLY deviation from the dragonball twin, forced by the dataset:
    # MS MARCO passages ARE natural retrieval chunks (p50 322 / p99.9 944
    # chars; 0.009% exceed 2048), so 2048/character is a 1:1 passthrough and
    # the vector count stays == the 8.84M corpus rows. Sweeping 128/256-char
    # chunks would multiply the corpus to 20-40M chunks: 100+ GB embedding
    # arrays per model and multi-hour per-trial index builds — infeasible.
    chunker:
      chunk_size: 2048
      component: character
  pipeline:
    # ── Dataflow knob (the autorag_co pattern): ONE shared node_lines,
    #    `rag_dataflow` picks sequential vs react per trial. It is a FLAT
    #    knob (shared stages share dims across modes), and the gate PARENT of
    #    the mode-specific params: under react the sequential-only stages
    #    (query_expansion / passage_compressor / prompt_maker) are gated OFF
    #    in the search space AND stripped from the resolved node_lines;
    #    `max_iter` is react-only. react runs retrieval + OPTIONAL
    #    passage_reranker + generator — the reranker head stays searchable in
    #    BOTH modes. The same gating applies to BOTH optimizers, so the
    #    ax/agent comparison stays fair. ──
    rag_dataflow:
    - sequential
    - react:                     # react sub-config — knobs active only when react is chosen
        max_iter:                # max Thought/Action/Observation rounds (the loop's ONLY cap)
        - 3
        - 5
        - 10
        - 15
    node_lines:
    - node_line_name: pre_retrieve_node_line
      nodes:
      - stage: query_expansion
        optional: true
        modules:
        - component: query_decompose
          generator_backend: vllm_api
          uri: ${RAG_LLM_BASE_URL}
          model:
            ordered:          # YAML value order IS the semantic order (size ladder)
            - Qwen/Qwen2.5-1.5B-Instruct
            - Qwen/Qwen2.5-3B-Instruct
            - Qwen/Qwen2.5-7B-Instruct
            - Qwen/Qwen2.5-14B-Instruct
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
        - component: hyde
          generator_backend: vllm_api
          uri: ${RAG_LLM_BASE_URL}
          model:
            ordered:          # YAML value order IS the semantic order (size ladder)
            - Qwen/Qwen2.5-1.5B-Instruct
            - Qwen/Qwen2.5-3B-Instruct
            - Qwen/Qwen2.5-7B-Instruct
            - Qwen/Qwen2.5-14B-Instruct
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
        - component: multi_query_expansion
          generator_backend: vllm_api
          uri: ${RAG_LLM_BASE_URL}
          model:
            ordered:          # YAML value order IS the semantic order (size ladder)
            - Qwen/Qwen2.5-1.5B-Instruct
            - Qwen/Qwen2.5-3B-Instruct
            - Qwen/Qwen2.5-7B-Instruct
            - Qwen/Qwen2.5-14B-Instruct
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
    - node_line_name: retrieve_node_line
      nodes:
      - stage: semantic_retrieval
        modules:
        - component: vectordb
          vectordb:                # SEARCH DIM: index family — per-family query-time knobs nest under their family
            faiss_ivf_index:
              nprobe: [8, 16, 32, 64]
            faiss_hnsw_index:
              ef_search: [32, 64, 128, 256]
        top_k:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
      - stage: passage_reranker    # searchable in BOTH modes (react reranks each round)
        optional: true
        modules:
        - component: tart
          bits: f32
        - component: monot5
          bits: f32
        - component: colbert_reranker
          bits: f32
        - component: sentence_transformer_reranker
          bits: f32
        - component: flag_embedding_reranker
          bits: f32
        top_k:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
      - stage: passage_compressor  # sequential-only (gated off + stripped under react)
        optional: true
        modules:
        - component: llmlingua2
          rate:
          - 0.3
          - 0.5
          - 0.7
    - node_line_name: post_retrieve_node_line
      nodes:
      - stage: prompt_maker        # sequential-only (react builds its own agentic prompt)
        modules:
        - component: fstring
          prompt: "Read the passages and answer the given question.\n Question: {query}\n Passage: {retrieved_contents}\n Answer :"
        - component: long_context_reorder
          prompt: "Question: {query}\n Context: {retrieved_contents}\n Answer:"
        - component: window_replacement
          prompt: "Question: {query}\n Context: {retrieved_contents}\n Answer:"
      - stage: generator
        modules:
        - component: vllm_api
          uri: ${RAG_LLM_BASE_URL}
          model:
            ordered:          # YAML value order IS the semantic order (size ladder)
            - Qwen/Qwen2.5-1.5B-Instruct
            - Qwen/Qwen2.5-3B-Instruct
            - Qwen/Qwen2.5-7B-Instruct
            - Qwen/Qwen2.5-14B-Instruct
          max_tokens: 512
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
