# =============================================================================
# Dataset Generator Configuration -- given_raw_article
# =============================================================================

strategy: given_raw_article

# --- AI model (determines provider automatically) ---
# openai/<model>                 → OpenAI API (requires OPENAI_API_KEY)
# anthropic/claude-code/<model>  → Claude Code SDK
model_name: anthropic/claude-code/sonnet

# --- Input: parsed raw documents ---
raw_data_path: data/parsed_raw.parquet

# --- Chunking ---
chunk_module_name: langchain_chunk       # or: llama_index_chunk
chunk_params:
  chunk_method: recursivecharacter
  chunk_size: 512
  chunk_overlap: 50

# --- Sampling ---
sample_fn: rag_stack.dataset_generator.given_raw_article.qa.sample.random_single_hop
sample_params:
  n: 100
  random_state: 42

# --- QA generation pipeline (executed in order) ---
qa_pipeline:
  # Step 1: fetch passage contents for retrieval_gt
  - fn: make_retrieval_gt_contents

  # Step 2: generate questions from passages
  - fn: generate_query
    kwargs:
      lang: en

  # Step 3: generate ground truth answers
  - fn: generate_answer
    kwargs:
      lang: en

  # Step 4 (optional): evolve questions for harder variants
  # - fn: evolve_query
  #   kwargs:
  #     lang: en

  # Step 5 (optional): filter low-quality QA pairs
  # - fn: dontknow_filter
  #   kwargs:
  #     lang: en
  #   is_filter: true
