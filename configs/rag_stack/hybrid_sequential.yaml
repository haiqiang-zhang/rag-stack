# Sequential dense + BM25 + RRF example using the standard Dragonball dataset.
# Set the hardware preset and available_gpus to the intended machine before
# running. This declares one GPU; it does not reserve or discover free devices.
# Analytical BM25 performance and hybrid join scheduling are unavailable;
# hybrid uses measured mode.
global:
  eval_backend: static_gt
  rag_ir_mode: dynamic
  n_iterations: 4

dataset:
  dataset_name: dragonball_en
  qa: datasets/dragonball/qa_en_sample_100.parquet
  corpus: datasets/dragonball/raw_corpus_en.parquet

system:
  performance_source: measured
  system_space_owner: optimizer
  cpu: epyc_9124
  gpu: A100_80GB_GPU
  performance_objectives:
    selection: max_throughput
  retrieval:
    faiss_num_threads: 1
  cm_search_space:
    placement_policy: [collocated]
    min_num_gpus: 1
    max_num_gpus: 1
    max_num_gpus_per_stage: 1
    gpus_per_server: 1
    max_batch_size_request: 4
    no_microbatching: true
  system_design_space:
    available_gpus: [cuda:0]
    batch_size_request: [1, 4]
    batch_size_decode: 8
    dynamic_batch_timeout_s: 0.002
    vllm_kv_cache_dtype: auto

optimizer:
  type: sobol
  params:
    seed: 42
    objectives:
      - {objective_name: performance, ref_point: 0.0, cost: 1.0}
      - {objective_name: quality, ref_point: 0.0, cost: 1.0}

eval_backend_setting:
  queries_per_trial: 16
  metrics: [bleu]
  combined_quality:
    mode: mean
    metrics: [bleu]

algo_search_space:
  corpus:
    chunker:
      component: character
      chunk_size: 1024
  vectordb:
    - name: faiss_hnsw_index
      db_type: faiss_hnsw
      embedding_model: huggingface_all_mpnet_base_v2
      embedding_dtype_bytes: 4
      collection_name: hybrid_dense
      embedding_dim: 768
      M: 16
      ef_construction: 100
  pipeline:
    node_lines:
      - node_line_name: retrieve_node_line
        nodes:
          - stage: semantic_retrieval
            top_k: [16, 32]
            modules:
              - component: vectordb
                vectordb: faiss_hnsw_index
                ef_search: [64, 128]
          - stage: lexical_retrieval
            top_k: [16, 32]
            modules:
              - component: bm25
                bm25_tokenizer: porter_stemmer
          - stage: hybrid_retrieval
            top_k: [4, 8]
            modules:
              - component: hybrid_rrf
                weight: [30, 60] # RRF rank constant, not a mixture weight.
      - node_line_name: answer_node_line
        nodes:
          - stage: prompt_maker
            modules:
              - component: fstring
                prompt: "Read the passages and answer the question.\nQuestion: {query}\nPassages: {retrieved_contents}\nAnswer:"
          - stage: generator
            modules:
              - component: vllm
                model: Qwen/Qwen2.5-1.5B-Instruct
                temperature: 0.0
                max_tokens: 64
                use_chat_template: true
