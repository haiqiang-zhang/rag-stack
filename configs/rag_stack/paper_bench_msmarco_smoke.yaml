# MS MARCO SMOKE — 50k local subset, in-process vLLM (Qwen 1.5B), n_iterations=4.
# Judge (deepseek, from .env) kept as primary quality metric. Exercises the real
# startup (chunk 50k + corpus normalization + index build + eval) to validate the
# preprocess fix end-to-end locally.
global:
  eval_backend: static_gt
  rag_ir_mode: dynamic
  n_iterations: 4
dataset:
  dataset_name: msmarco_smoke
  qa: datasets/msmarco_smoke/qa_test.parquet
  corpus: datasets/msmarco_smoke/corpus.parquet
system:
  system_hardware: sgs_h100x4_epyc9124
  performance_source: cost_model
  cpu: epyc_9124
  gpu: H100_GPU
  interconnect:
    gpu_gpu:
      type: h100_nvl_2pair
      bandwidth_gbps: 300
      latency_us: 0.4
      fallback:
        type: pcie5_pxb
        bandwidth_gbps: 54
        latency_us: 1.0
      links:
      - devices:
        - cuda:0
        - cuda:1
        type: nvlink4
        bandwidth_gbps: 300
        latency_us: 0.4
      - devices:
        - cuda:2
        - cuda:3
        type: nvlink4
        bandwidth_gbps: 300
        latency_us: 0.4
    gpu_cpu:
      type: pcie5_host
      bandwidth_gbps: 54
      latency_us: 0.8
  performance_objectives:
    selection: max_throughput
  retrieval:
    faiss_num_threads:
    faiss_ivf_parallel_mode: 0
  cm_search_space:
    placement_policy:
    - collocated
    - disaggregated
    min_num_gpus: 4
    max_num_gpus: 4
    max_num_gpus_per_stage: 4
    gpus_per_server: 4
    max_batch_size_request: 256
    no_microbatching: true
optimizer:
  type: greedy
  params:
    seed: 43
    search_mode: forward
    beam_width: 3
    stage_weight: log
eval_backend_setting:
  combined_quality:
    mode: mean
    metrics:
    - deepeval_answer_correctness
  metrics:
  - metric_name: deepeval_answer_correctness
    model: openai/deepseek/deepseek-v4-flash
    description: "GEval-based factual correctness — LLM-judge compares generated answer (actual_output) to gold answer (generation_gt). Score ∈ [0,1]. THE business target."
  - metric_name: retrieval_token_recall
    description: "Token-overlap recall of the retrieval-GT text (references when present, else the answer) against the retrieved chunk text (pre-reranker) — chunker-invariant (matches TEXT, not chunk IDs)."
  - metric_name: retrieval_token_precision
    description: "Token-overlap precision — fraction of the retrieved chunk text that matches the retrieval-GT text (references/answer); chunker-invariant, pairs with retrieval_token_recall."
algo_search_space:
  vectordb:
  - name: faiss_ivf_index
    db_type: faiss_ivf
    embedding_model: huggingface_all_mpnet_base_v2
    embedding_dtype_bytes: 4  # serialized FAISS query vector is float32
    collection_name: my_index
    nlist_factor:
    - 1
    - 4
    index_type:
      pq:
        dsub:
        - 4
        - 32
        nbits:
        - 4
        - 8
      flat: {}
  - name: faiss_hnsw_index
    db_type: faiss_hnsw
    embedding_model: huggingface_all_mpnet_base_v2
    embedding_dtype_bytes: 4  # serialized FAISS query vector is float32
    collection_name: my_hnsw_index
    M:
    - 16
    - 48
    ef_construction:
    - 100
    - 400
  corpus:
    chunker:
      chunk_size: 2048
      component: character
  pipeline:
    rag_dataflow:
    - sequential
    - react:
        max_iter:
        - 3
        - 5
        - 10
        - 15
    node_lines:
    - node_line_name: pre_retrieve_node_line
      nodes:
      - stage: query_expansion
        optional: true
        modules:
        - component: query_decompose
          generator_backend: vllm
          model: Qwen/Qwen2.5-1.5B-Instruct
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
          gpu_memory_utilization: 0.4
          dtype: bfloat16
        - component: hyde
          generator_backend: vllm
          model: Qwen/Qwen2.5-1.5B-Instruct
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
          gpu_memory_utilization: 0.4
          dtype: bfloat16
        - component: multi_query_expansion
          generator_backend: vllm
          model: Qwen/Qwen2.5-1.5B-Instruct
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
          gpu_memory_utilization: 0.4
          dtype: bfloat16
    - node_line_name: retrieve_node_line
      nodes:
      - stage: semantic_retrieval
        modules:
        - component: vectordb
          vectordb:
            faiss_ivf_index:
              nprobe:
              - 8
              - 16
              - 32
              - 64
            faiss_hnsw_index:
              ef_search:
              - 32
              - 64
              - 128
              - 256
        top_k:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
      - stage: passage_reranker
        optional: true
        modules:
        - component: tart
          bits: f32
        - component: monot5
          bits: f32
        - component: colbert_reranker
          bits: f32
        - component: sentence_transformer_reranker
          bits: f32
        - component: flag_embedding_reranker
          bits: f32
        top_k:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
      - stage: passage_compressor
        optional: true
        modules:
        - component: llmlingua2
          rate:
          - 0.3
          - 0.5
          - 0.7
    - node_line_name: post_retrieve_node_line
      nodes:
      - stage: prompt_maker
        modules:
        - component: fstring
          prompt: "Read the passages and answer the given question.\n Question: {query}\n Passage: {retrieved_contents}\n Answer :"
        - component: long_context_reorder
          prompt: "Question: {query}\n Context: {retrieved_contents}\n Answer:"
        - component: window_replacement
          prompt: "Question: {query}\n Context: {retrieved_contents}\n Answer:"
      - stage: generator
        modules:
        - component: vllm
          model: Qwen/Qwen2.5-1.5B-Instruct
          max_tokens: 512
          temperature:
          - 0.0
          - 0.3
          - 0.7
          - 1.0
          gpu_memory_utilization: 0.4
          dtype: bfloat16
